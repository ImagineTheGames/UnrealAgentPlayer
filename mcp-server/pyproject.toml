[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unreal-agent-player"
version = "0.0.1"
description = "MCP server for driving Unreal Editor in an agent self-test loop."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "ruff>=0.5",
]
windows = [
  "comtypes>=1.4",
]

[project.scripts]
unreal-agent-player = "unreal_agent_player.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unreal_agent_player"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Tests use compact stub patterns: semicolon-joined stub bodies, throwaway vars,
# and append-style imports partway down a file.
"tests/**" = ["E402", "E702", "E741", "F841"]
